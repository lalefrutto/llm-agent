# Детерминированная часть evals: guardrails, загрузчик skills и логика графа
# с подменённой LLM. Без Ollama/Qdrant/Docker — живые evals запускаются
# вручную: python evals/run_evals.py --live --repeats 5 (см. README).
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q
      - run: python evals/run_evals.py --dataset evals/dataset.jsonl
