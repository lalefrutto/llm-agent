apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus   # фиксированный uid — на него ссылается dashboards/json/atlas-agent.json
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
