route:
  receiver: default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Заглушка: подставить реальный канал (Slack/Telegram/email webhook)
    # на машине развёртывания. Пример для Slack:
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    #     channel: "#agent-alerts"
    webhook_configs:
      - url: "http://localhost:9999/alerts-placeholder"
        send_resolved: true
